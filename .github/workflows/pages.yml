name: GitHub Pages Deployment

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'content/landing_pages/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

actions:
  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: ./docs

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v3