<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <rect width="1000" height="1500" fill="white"/>

  <!-- Purple accent header bar -->
  <rect x="0" y="0" width="1000" height="100" fill="#5a3de6"/>

  <!-- Large "4" in purple circle -->
  <circle cx="500" cy="180" r="55" fill="#5a3de6"/>
  <text x="500" y="188" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">4</text>

  <!-- Pin icon (emoji) -->
  <text x="500" y="275" font-family="Arial, sans-serif" font-size="32" fill="#5a3de6" text-anchor="middle">💳</text>

  <!-- Title -->
  <text x="500" y="330" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333" text-anchor="middle">Setup Checklist</text>

  <!-- Subtitle -->
  <text x="500" y="378" font-family="Arial, sans-serif" font-size="20" fill="#5a3de6" text-anchor="middle">3 Things to Get Right at Checkout</text>

  <!-- Checklist section header -->
  <text x="120" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5a3de6">Before you pay — confirm these:</text>

  <!-- Checklist item 1: Domain choice -->
  <rect x="120" y="450" width="760" height="68" fill="#f8f9fa" stroke="#5a3de6" stroke-width="1" rx="8"/>
  <circle cx="165" cy="484" r="20" fill="#5a3de6"/>
  <text x="165" y="490" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <text x="215" y="478" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Domain choice</text>
  <text x="215" y="500" font-family="Arial, sans-serif" font-size="14" fill="#555">Pick a name you'll keep for years — free for 1st year on annual plans</text>

  <!-- Checklist item 2: Account details -->
  <rect x="120" y="528" width="760" height="68" fill="#f8f9fa" stroke="#5a3de6" stroke-width="1" rx="8"/>
  <circle cx="165" cy="562" r="20" fill="#5a3de6"/>
  <text x="165" y="568" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">2</text>
  <text x="215" y="556" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Account details</text>
  <text x="215" y="578" font-family="Arial, sans-serif" font-size="14" fill="#555">Use an email you check — login + receipts are sent there</text>

  <!-- Checklist item 3: Payment method -->
  <rect x="120" y="606" width="760" height="68" fill="#f8f9fa" stroke="#5a3de6" stroke-width="1" rx="8"/>
  <circle cx="165" cy="640" r="20" fill="#5a3de6"/>
  <text x="165" y="646" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="215" y="634" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Payment method</text>
  <text x="215" y="656" font-family="Arial, sans-serif" font-size="14" fill="#555">Card or PayPal — auto-renews unless cancelled</text>

  <!-- Warning: 30-day refund -->
  <rect x="120" y="700" width="760" height="68" fill="#fff4e6" stroke="#ff9800" stroke-width="2" rx="8"/>
  <text x="160" y="740" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ff9800">!</text>
  <text x="190" y="730" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">30-day money-back window</text>
  <text x="190" y="750" font-family="Arial, sans-serif" font-size="14" fill="#555">Keep your receipt — refunds must be requested within 30 days</text>

  <!-- Checkout illustration: mock checkout card -->
  <rect x="140" y="800" width="720" height="200" fill="#f8f9fa" stroke="#5a3de6" stroke-width="2" rx="10"/>
  <text x="160" y="830" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#5a3de6">hPanel — Checkout Summary</text>

  <!-- Mock row 1 -->
  <text x="160" y="858" font-family="Arial, sans-serif" font-size="13" fill="#333">Hosting plan</text>
  <text x="840" y="858" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="end">Premium</text>
  <line x1="160" y1="868" x2="840" y2="868" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Mock row 2 -->
  <text x="160" y="888" font-family="Arial, sans-serif" font-size="13" fill="#333">Billing cycle</text>
  <text x="840" y="888" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="end">48 months</text>
  <line x1="160" y1="898" x2="840" y2="898" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Mock row 3 -->
  <text x="160" y="918" font-family="Arial, sans-serif" font-size="13" fill="#333">Free domain (1st year)</text>
  <text x="840" y="918" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4caf50" text-anchor="end">Included</text>
  <line x1="160" y1="928" x2="840" y2="928" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Mock total -->
  <text x="160" y="955" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#5a3de6">Total today</text>
  <text x="840" y="955" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#5a3de6" text-anchor="end">$2.99/mo</text>

  <!-- Mock button -->
  <rect x="540" y="970" width="300" height="20" fill="#5a3de6" rx="3"/>
  <text x="690" y="985" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Complete Purchase</text>

  <!-- CTA button -->
  <rect x="350" y="1040" width="300" height="70" fill="#5a3de6" rx="35"/>
  <text x="500" y="1085" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Complete Setup →</text>

  <!-- Footer -->
  <rect x="0" y="1380" width="1000" height="120" fill="#5a3de6"/>
  <text x="500" y="1410" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Illustrative pricing — verify on hostinger.com at checkout</text>
  <text x="500" y="1435" font-family="Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="middle">This guide is not affiliated with Hostinger</text>
  <text x="500" y="1455" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">All prices verified September 2026</text>
</svg>
