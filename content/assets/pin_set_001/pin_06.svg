<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <rect width="1000" height="1500" fill="white"/>

  <!-- Purple accent header bar -->
  <rect x="0" y="0" width="1000" height="100" fill="#5a3de6"/>

  <!-- Large "6" in purple circle -->
  <circle cx="500" cy="180" r="55" fill="#5a3de6"/>
  <text x="500" y="188" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">6</text>

  <!-- Pin icon (emoji) -->
  <text x="500" y="275" font-family="Arial, sans-serif" font-size="32" fill="#5a3de6" text-anchor="middle">⬇️</text>

  <!-- Title -->
  <text x="500" y="330" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333" text-anchor="middle">Install WordPress</text>

  <!-- Subtitle -->
  <text x="500" y="378" font-family="Arial, sans-serif" font-size="20" fill="#5a3de6" text-anchor="middle">One-Click Install in Under 2 Minutes</text>

  <!-- Section header -->
  <text x="120" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5a3de6">Follow these 3 steps in hPanel:</text>

  <!-- 3-step horizontal flow -->
  <!-- Step 1: hPanel -->
  <rect x="80" y="450" width="270" height="200" fill="#f8f9fa" stroke="#5a3de6" stroke-width="2" rx="10"/>
  <circle cx="215" cy="490" r="22" fill="#5a3de6"/>
  <text x="215" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <text x="215" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#5a3de6" text-anchor="middle">hPanel</text>
  <text x="215" y="570" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">Open your Hostinger</text>
  <text x="215" y="590" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">control panel and</text>
  <text x="215" y="610" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">click "Auto Installer"</text>
  <text x="215" y="630" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#888" text-anchor="middle">~30 seconds</text>

  <!-- Arrow 1 -->
  <text x="365" y="558" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#5a3de6" text-anchor="middle">→</text>

  <!-- Step 2: Auto Installer -->
  <rect x="385" y="450" width="270" height="200" fill="#f8f9fa" stroke="#5a3de6" stroke-width="2" rx="10"/>
  <circle cx="520" cy="490" r="22" fill="#5a3de6"/>
  <text x="520" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">2</text>
  <text x="520" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#5a3de6" text-anchor="middle">Auto Installer</text>
  <text x="520" y="570" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">Pick WordPress from</text>
  <text x="520" y="590" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">the app catalog and</text>
  <text x="520" y="610" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">click "Install"</text>
  <text x="520" y="630" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#888" text-anchor="middle">~30 seconds</text>

  <!-- Arrow 2 -->
  <text x="670" y="558" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#5a3de6" text-anchor="middle">→</text>

  <!-- Step 3: WordPress -->
  <rect x="690" y="450" width="240" height="200" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="10"/>
  <circle cx="810" cy="490" r="22" fill="#4caf50"/>
  <text x="810" y="498" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="810" y="540" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#4caf50" text-anchor="middle">WordPress</text>
  <text x="810" y="570" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Site is live with</text>
  <text x="810" y="590" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">default settings</text>
  <text x="810" y="610" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">and admin login</text>
  <text x="810" y="630" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#4caf50" text-anchor="middle">Done!</text>

  <!-- Stopwatch callout card -->
  <rect x="120" y="690" width="760" height="100" fill="#fff4e6" stroke="#ff9800" stroke-width="2" rx="10"/>
  <circle cx="170" cy="740" r="32" fill="white" stroke="#ff9800" stroke-width="3"/>
  <text x="170" y="752" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ff9800" text-anchor="middle">⏱</text>
  <text x="220" y="730" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">Under 2 minutes</text>
  <text x="220" y="758" font-family="Arial, sans-serif" font-size="15" fill="#555">Total install time — no manual file uploads or database setup needed</text>
  <text x="220" y="778" font-family="Arial, sans-serif" font-size="13" fill="#888">Hostinger's auto-installer handles everything for you</text>

