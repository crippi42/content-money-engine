  <text x="120" y="830" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5a3de6">Auto-installer sets up everything for you:</text>

  <!-- Included card -->
  <rect x="120" y="850" width="760" height="180" fill="#f8f9fa" stroke="#5a3de6" stroke-width="1" rx="10"/>

  <!-- 2-column included items -->
  <!-- Left column -->
  <circle cx="155" cy="890" r="12" fill="#4caf50"/>
  <text x="155" y="895" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  <text x="185" y="896" font-family="Arial, sans-serif" font-size="15" fill="#333">Free SSL certificate</text>

  <circle cx="155" cy="925" r="12" fill="#4caf50"/>
  <text x="155" y="930" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  <text x="185" y="931" font-family="Arial, sans-serif" font-size="15" fill="#333">WordPress core files</text>

  <circle cx="155" cy="960" r="12" fill="#4caf50"/>
  <text x="155" y="965" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  <text x="185" y="966" font-family="Arial, sans-serif" font-size="15" fill="#333">Database auto-created</text>

  <circle cx="155" cy="995" r="12" fill="#4caf50"/>
  <text x="155" y="1000" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  <text x="185" y="1001" font-family="Arial, sans-serif" font-size="15" fill="#333">Default admin account</text>

  <!-- Right column -->
  <circle cx="525" cy="890" r="12" fill="#4caf50"/>
  <text x="525" y="895" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  <text x="555" y="896" font-family="Arial, sans-serif" font-size="15" fill="#333">LiteSpeed cache plugin</text>

  <circle cx="525" cy="925" r="12" fill="#4caf50"/>
  <text x="525" y="930" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  <text x="555" y="931" font-family="Arial, sans-serif" font-size="15" fill="#333">Auto-update enabled</text>

  <circle cx="525" cy="960" r="12" fill="#4caf50"/>
  <text x="525" y="965" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  <text x="555" y="966" font-family="Arial, sans-serif" font-size="15" fill="#333">SFTP + file manager</text>

  <circle cx="525" cy="995" r="12" fill="#4caf50"/>
  <text x="525" y="1000" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">✓</text>
  <text x="555" y="1001" font-family="Arial, sans-serif" font-size="15" fill="#333">Login emailed to you</text>

  <!-- CTA button -->
  <rect x="350" y="1080" width="300" height="70" fill="#5a3de6" rx="35"/>
  <text x="500" y="1125" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Install Now →</text>

  <!-- Footer -->
  <rect x="0" y="1380" width="1000" height="120" fill="#5a3de6"/>
  <text x="500" y="1410" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Auto-installer includes SSL + default settings</text>
  <text x="500" y="1435" font-family="Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="middle">This guide is not affiliated with Hostinger</text>
  <text x="500" y="1455" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">All prices verified September 2026</text>
</svg>
