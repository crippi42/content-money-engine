<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500">
  <rect width="1000" height="1500" fill="white"/>

  <!-- Purple accent header bar -->
  <rect x="0" y="0" width="1000" height="100" fill="#5a3de6"/>

  <!-- Large "3" in purple circle -->
  <circle cx="500" cy="180" r="55" fill="#5a3de6"/>
  <text x="500" y="188" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">3</text>

  <!-- Pin icon (emoji) -->
  <text x="500" y="275" font-family="Arial, sans-serif" font-size="32" fill="#5a3de6" text-anchor="middle">📋</text>

  <!-- Title -->
  <text x="500" y="335" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333" text-anchor="middle">Hostinger Plan Comparison</text>
  <text x="500" y="375" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#333" text-anchor="middle">Which Is Right for You?</text>

  <!-- Subtitle -->
  <text x="500" y="425" font-family="Arial, sans-serif" font-size="20" fill="#5a3de6" text-anchor="middle">Premium vs Unlimited vs Cloud Startup</text>

  <!-- 3-Column Comparison Table -->
  <!-- Table header -->
  <rect x="100" y="470" width="800" height="55" fill="#5a3de6" rx="8"/>
  <text x="300" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Premium</text>
  <text x="500" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Unlimited</text>
  <text x="700" y="505" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">Cloud Startup</text>

  <!-- Price row -->
  <rect x="100" y="525" width="800" height="50" fill="#f8f9fa" stroke="#5a3de6" stroke-width="1"/>
  <text x="300" y="558" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5a3de6" text-anchor="middle">$2.99/mo</text>
  <text x="500" y="558" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5a3de6" text-anchor="middle">$3.99/mo</text>
  <text x="700" y="558" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5a3de6" text-anchor="middle">$7.99/mo</text>

  <!-- Description row -->
  <rect x="100" y="575" width="800" height="50" fill="#f8f9fa" stroke="#5a3de6" stroke-width="1"/>
  <text x="300" y="608" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">3 websites</text>
  <text x="500" y="608" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">Unlimited sites</text>
  <text x="700" y="608" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">Free domain 1st year</text>

  <!-- Features row -->
  <rect x="100" y="625" width="800" height="50" fill="#f8f9fa" stroke="#5a3de6" stroke-width="1"/>
  <text x="300" y="658" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">CDN</text>
  <text x="500" y="658" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">Daily backups</text>
  <text x="700" y="658" font-family="Arial, sans-serif" font-size="14" fill="#555" text-anchor="middle">eComm ready</text>

  <!-- Table bottom border -->
  <rect x="100" y="675" width="800" height="2" fill="#5a3de6"/>

  <!-- Best Value badge (centered under Unlimited column) -->
  <rect x="430" y="705" width="140" height="40" fill="#5a3de6" rx="5"/>
  <text x="500" y="733" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Best Value</text>

  <!-- Recommendation -->
  <rect x="120" y="770" width="760" height="80" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="8"/>
  <text x="500" y="805" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Which plan fits your needs?</text>
  <text x="500" y="828" font-family="Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">Blog/portfolio → Premium | Business/store → Cloud Startup | Agency → Unlimited or Premium</text>

  <!-- CTA button -->
  <rect x="350" y="890" width="300" height="70" fill="#5a3de6" rx="35"/>
  <text x="500" y="935" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Compare Plans →</text>

  <!-- Footer -->
  <rect x="0" y="1050" width="1000" height="110" fill="#5a3de6"/>
  <text x="500" y="1080" font-family="Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="middle">This guide is not affiliated with Hostinger</text>
  <text x="500" y="1100" font-family="Arial, sans-serif" font-size="10" fill="#cccccc" text-anchor="middle">All prices verified September 2026 (48-month plans)</text>
</svg>